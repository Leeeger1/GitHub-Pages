name: 桌面安装包

# 推一个 v 开头的标签（比如 v0.2.0）就会在 Windows / macOS / Linux 上各打一个安装包，并发布到 Releases。
# 也可以在 Actions 页面手动运行：填上版本号就打包并发布（标签由 GitHub 自动创建），不填就只打包。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 发布的版本号，比如 v0.2.0（留空就只打包、不发布）
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 跑测试
        if: runner.os == 'Linux'
        run: npm test

      - name: 安装打包工具
        working-directory: desktop
        run: npm ci

      - name: 打包
        working-directory: desktop
        run: npx electron-builder --publish never
        env:
          # 没有苹果开发者证书，macOS 包不签名（第一次打开要右键 → 打开）。
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: niuma-studio-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: 牛马工作室 ${{ inputs.version || github.ref_name }}
          files: dist/*
          body: |
            ## 下载

            | 系统 | 下载哪个 |
            |---|---|
            | Windows | `niuma-studio-*-win-x64.exe`，双击安装 |
            | macOS | `niuma-studio-*-mac-universal.dmg`，拖进「应用程序」；第一次打开要右键 → 打开 |
            | Linux | `niuma-studio-*-linux-x86_64.AppImage`，加上可执行权限后双击 |

            装好以后打开「牛马工作室」，选一个项目文件夹就能开工。还没有员工的话点右上角「接入员工」：
            Claude Code、Codex 一键安装登录，DeepSeek、中转站这类 API 选一家填上 Key 就能接。
            想先看看效果，菜单「项目 → 彩排模式」用替身员工演一遍，不花钱、不改文件。
