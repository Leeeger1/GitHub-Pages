<meta charset="utf-8">
<title>Mavis 像素工作室</title>
<meta name="description" content="你只跟 Mavis 说话，她把任务分给 Claude Code 和 Codex，并在像素办公室里直播它们干活。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">

<div class="app">
  <header class="top">
    <div class="brand">
      <span class="wordmark">MAVIS</span>
      <span class="tagline">你只管说，Claude 和 Codex 去干</span>
    </div>
    <div class="conn">
      <span id="conn" class="pill pill-wait">连接中…</span>
      <code id="workdir" class="workdir"></code>
    </div>
  </header>

  <main class="layout">
    <section class="stage-wrap" aria-label="像素办公室">
      <div class="stage" id="stage">
        <canvas id="office" width="320" height="180" role="img" aria-label="像素办公室：Mavis 坐在中间，左边是 Claude，右边是 Codex"></canvas>
        <div class="overlay" id="overlay" aria-hidden="true"></div>
      </div>
      <div class="roster" id="roster"></div>
    </section>

    <aside class="chat" aria-label="和 Mavis 对话">
      <div class="panel-head">
        <h2>和 Mavis 说</h2>
        <button type="button" id="stop" class="btn-stop" hidden>全部停下</button>
      </div>
      <div id="banner" class="banner" hidden></div>
      <div id="messages" class="messages" aria-live="polite"></div>
      <div class="suggest" id="suggest"></div>
      <form id="composer" class="composer">
        <label for="input" class="sr-only">给 Mavis 的话</label>
        <textarea id="input" rows="2" placeholder="比如：给首页加个暗色模式，顺便把测试补上"></textarea>
        <button type="submit" id="send" class="btn-send">发送</button>
      </form>
      <p class="hint">Enter 发送 · Shift+Enter 换行 · <code>@claude</code> <code>@codex</code> 直接点名 · <code>/stop</code> 叫停</p>
    </aside>

    <section class="board" aria-label="任务板">
      <div class="panel-head">
        <h2>任务板</h2>
        <span id="round" class="round"></span>
      </div>
      <ol id="tasks" class="tasks"></ol>
      <p id="tasks-empty" class="empty">还没有任务。跟 Mavis 说说要做什么，她会拆好分给两位工程师。</p>
    </section>
  </main>
</div>

<script src="office.js"></script>
<script src="demo.js"></script>
<script src="app.js"></script>
