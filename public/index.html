<meta charset="utf-8">
<title>牛马工作室</title>
<meta name="description" content="牛马工作室：你只跟总管傻妞说话，她开项目会、按难度和技能把任务派给各个项目组的员工，自动验收、返工、存档。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=JetBrains+Mono:wght@400;600&family=ZCOOL+KuaiLe&display=swap">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">

<div class="app">
  <header class="top">
    <div class="brand">
      <span class="wordmark">牛马工作室</span>
      <span class="wordmark-sub">总管 · 傻妞</span>
      <span class="tagline">你只管说，傻妞带着牛马们干</span>
    </div>
    <div class="skins" id="skins" role="group" aria-label="切换皮肤"></div>
    <div class="conn">
      <span id="conn" class="pill pill-wait">连接中…</span>
      <code id="workdir" class="workdir"></code>
    </div>
  </header>

  <main class="layout">
    <section class="stage-wrap" aria-label="牛马工作室">
      <div class="stage">
        <div class="scene" id="scene">
          <canvas id="office" width="404" height="216" role="img" aria-label="牛马工作室：傻妞坐在中间，各项目组的员工坐在两边的工位上"></canvas>
          <div class="overlay" id="overlay" aria-hidden="true"></div>
        </div>
      </div>
      <div class="team" id="team" aria-label="项目组和员工"></div>
    </section>

    <aside class="chat" aria-label="和傻妞对话">
      <div class="panel-head">
        <h2>和傻妞说</h2>
        <button type="button" id="stop" class="btn-stop" hidden>全部停下</button>
      </div>
      <div id="banner" class="banner" hidden></div>
      <div id="messages" class="messages" aria-live="polite"></div>
      <div class="suggest" id="suggest"></div>
      <form id="composer" class="composer">
        <label for="input" class="sr-only">给傻妞的话</label>
        <textarea id="input" rows="2" placeholder="随便说，比如：帮我做一个记账小网站"></textarea>
        <button type="submit" id="send" class="btn-send">发送</button>
      </form>
      <p class="hint">Enter 发送 · Shift+Enter 换行 · <code>@员工</code> 点名 · <code>/招人</code> <code>/工具</code> <code>/团队</code> <code>/撤销</code> <code>/stop</code></p>
    </aside>

    <section class="board" aria-label="任务板">
      <div class="panel-head">
        <h2>任务板</h2>
        <span id="round" class="round"></span>
        <button type="button" id="undo" class="btn-ghost" hidden>撤销上一轮</button>
      </div>
      <div id="meeting" class="meeting-card" hidden></div>
      <ol id="tasks" class="tasks"></ol>
      <p id="tasks-empty" class="empty">还没有任务。跟傻妞说说要做什么，说得模糊也没关系：她会开会、拆任务、派给合适的员工，做完自己验收。</p>
    </section>
  </main>
</div>

<script src="office.js"></script>
<script src="chibi.js"></script>
<script src="anime.js"></script>
<script src="demo.js"></script>
<script src="app.js"></script>
